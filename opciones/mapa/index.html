<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ignacio Grandón · El mapa</title>
    <meta name="description" content="Portafolio de Ignacio Grandón como un grafo: proyectos, empresas y herramientas conectados." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Opción 4: el grafo del mapa agéntico pasa a ser la navegación completa.
         Nodos: Ignacio, proyectos, empresas y herramientas. Arrastrar, filtrar por año
         y soltar un proyecto sobre otro para ver qué comparten. */
      :root {
        --bg: #f4f2ee; --surface: #fbfaf7; --fg: #141414; --muted: #6f6c66; --line: #d8d4cc;
        --accent: #2f5bff; --edge: rgba(20,20,20,.14); --edge-hot: #141414;
        --sans: "Inter Tight", system-ui, sans-serif; --serif: "Instrument Serif", Georgia, serif; --mono: "JetBrains Mono", ui-monospace, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #111110; --surface: #191917; --fg: #ecebe7; --muted: #8d8a83; --line: #2a2926; --accent: #7d97ff; --edge: rgba(236,235,231,.14); --edge-hot: #ecebe7; color-scheme: dark; }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body { background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      a { color: inherit; }
      :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      canvas.is-grab { cursor: grab; } canvas.is-grabbing { cursor: grabbing; }

      .bar {
        position: fixed; z-index: 5; top: 0; left: 0; right: 0; pointer-events: none;
        display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;
        padding: calc(18px + env(safe-area-inset-top)) clamp(16px, 3vw, 32px) 0;
      }
      .bar > * { pointer-events: auto; }
      body.panel-open .bar { padding-right: 456px; transition: padding .5s; }
      @media (max-width: 760px) { body.panel-open .bar { padding-right: 16px; } }
      .brand h1 { font: 400 clamp(26px, 3vw, 36px)/1 var(--serif); letter-spacing: -.01em; }
      .brand p { color: var(--muted); font-size: 13px; margin-top: 6px; }
      .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
      .years { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
      .years button { padding: 6px 10px; border-radius: 999px; font: 500 12px/1 var(--mono); color: var(--muted); }
      .years button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
      .textview-btn { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
      .hint {
        position: fixed; z-index: 4; left: clamp(16px, 3vw, 32px); bottom: 76px; max-width: 300px;
        color: var(--muted); font-size: 13px; pointer-events: none; transition: opacity .4s;
      }
      .legend { display: flex; gap: 14px; margin-top: 8px; font: 500 11px/1 var(--mono); }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

      /* Panel de detalle */
      .panel {
        position: fixed; z-index: 6; top: 12px; right: 12px; bottom: 12px; width: min(420px, calc(100vw - 24px));
        background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
        box-shadow: 0 24px 60px -30px rgba(0,0,0,.35);
        display: flex; flex-direction: column; overflow: hidden;
        transform: translateX(calc(100% + 24px)); transition: transform .5s cubic-bezier(.16,1,.3,1);
      }
      .panel.is-open { transform: none; }
      .panel__head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
      .panel__close { padding: 6px 8px; margin: -6px -8px; border-radius: 6px; font: 500 12px/1 var(--mono); }
      .panel__close:hover { background: var(--bg); }
      .panel__body { overflow-y: auto; padding: 20px 22px 90px; display: flex; flex-direction: column; gap: 14px; }
      .panel__body img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; background: var(--line); }
      .panel__body h2 { font: 400 34px/1.02 var(--serif); letter-spacing: -.01em; }
      .panel__meta { font: 500 12px/1.3 var(--mono); color: var(--muted); }
      .panel__body ul.hl { list-style: none; display: grid; gap: 8px; font-size: 14px; }
      .panel__body ul.hl li { padding-left: 16px; position: relative; }
      .panel__body ul.hl li::before { content: ""; position: absolute; left: 0; top: .65em; width: 6px; height: 1px; background: currentColor; }
      .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
      .chips li, .chips button { font: 500 11px/1 var(--mono); padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; }
      .chips button:hover { border-color: var(--fg); }
      .panel__cta { align-self: flex-start; padding: 10px 16px; border-radius: 999px; background: var(--fg); color: var(--bg); text-decoration: none; font-weight: 500; font-size: 14px; }
      .panel__mail { font: 400 clamp(24px, 3vw, 30px)/1.1 var(--serif); overflow-wrap: anywhere; }
      .common { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; font: 400 22px/1.1 var(--serif); }
      .common span { text-align: center; font: 500 16px/1 var(--mono); color: var(--muted); }

      /* Vista en texto: el mismo contenido, sin el grafo */
      .textview {
        position: fixed; inset: 0; z-index: 8; overflow-y: auto; background: var(--bg);
        padding: calc(24px + env(safe-area-inset-top)) clamp(16px, 4vw, 48px) 110px; display: none;
      }
      .textview.is-open { display: block; }
      .textview__inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
      .textview h2 { font: 400 40px/1 var(--serif); }
      .textview h3 { font: 400 28px/1.05 var(--serif); }
      .textview article { border-top: 1px solid var(--line); padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
      .textview .top { display: flex; justify-content: space-between; align-items: center; }

      @media (max-width: 760px) {
        .panel { top: auto; left: 8px; right: 8px; width: auto; bottom: 8px; height: 62dvh; transform: translateY(calc(100% + 24px)); }
        .controls { align-items: flex-start; }
        .years { justify-content: flex-start; }
        .hint { bottom: 70px; right: 16px; }
      }
      @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
    </style>
  </head>
  <body>
    <canvas id="map" role="img" aria-label="Grafo con los proyectos de Ignacio Grandón, las empresas y las herramientas que los conectan. Hay una vista en texto con el mismo contenido."></canvas>

    <header class="bar">
      <div class="brand">
        <h1 id="name"></h1>
        <p id="role"></p>
        <div class="legend" aria-hidden="true">
          <span><i style="background:var(--fg)"></i>Proyecto</span>
          <span><i style="background:var(--accent)"></i>Empresa</span>
          <span><i style="border:1.5px solid var(--muted)"></i>Herramienta</span>
        </div>
      </div>
      <div class="controls">
        <div class="years" id="years" role="group" aria-label="Filtrar por año"></div>
        <button class="textview-btn" type="button" id="open-text">Ver en texto</button>
      </div>
    </header>

    <p class="hint" id="hint">Arrastra los nodos. Haz clic en un proyecto para abrirlo, o suéltalo sobre otro para ver qué tienen en común.</p>

    <aside class="panel" id="panel" aria-live="polite">
      <div class="panel__head"><span id="panel-kicker"></span><button class="panel__close" type="button" id="panel-close">Cerrar ✕</button></div>
      <div class="panel__body" id="panel-body"></div>
    </aside>

    <section class="textview" id="textview" aria-label="Vista en texto">
      <div class="textview__inner" id="textview-inner"></div>
    </section>

    <script src="../../js/data.js"></script>
    <script>
      (function () {
        const { profile, featured, projects } = window.PORTFOLIO;
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const IMG = (s) => "../../" + s;
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

        document.getElementById("name").textContent = profile.name;
        document.getElementById("role").textContent = profile.role;

        // ---------- Grafo ----------
        // Empresas y agrupaciones que no están como tags en data.js, pero sí en
        // la categoría o el resumen de cada proyecto.
        const company = { "Lyra Design System": "SKY Airline", "Mapa agéntico de Lyra": "SKY Airline", "SKY Airline App": "SKY Airline", "Ninja Excel by Buk": "Buk" };
        const extra = {
          "Lyra Design System": ["Design systems"],
          "Mapa agéntico de Lyra": ["Design systems"],
          "SKY Airline App": ["App móvil"],
          "Pinché App": ["App móvil"],
          "App BancoEstado": ["App móvil"],
          "Sixevent": ["Sistema de productividad"],
        };
        const yearOf = (y) => (y === "Actual" ? "Hoy" : y.slice(-4));

        const nodes = [];
        const byId = new Map();
        const add = (n) => {
          if (byId.has(n.id)) return byId.get(n.id);
          Object.assign(n, { x: 0, y: 0, vx: 0, vy: 0, links: new Set() });
          nodes.push(n);
          byId.set(n.id, n);
          return n;
        };
        const edges = [];
        const link = (a, b) => {
          if (a.links.has(b)) return;
          a.links.add(b);
          b.links.add(a);
          edges.push([a, b]);
        };

        const me = add({ id: "me", kind: "me", label: profile.name.split(" ")[0], r: 26 });
        [...featured, ...projects].forEach((p, i) => {
          const n = add({ id: "p:" + p.title, kind: "project", label: p.title, data: p, featured: i < featured.length, year: yearOf(p.year), r: i < featured.length ? 15 : 10 });
          link(me, n);
          if (company[p.title]) link(n, add({ id: "c:" + company[p.title], kind: "company", label: company[p.title], r: 12 }));
          [...(p.tags || []), ...(extra[p.title] || [])].forEach((t) => link(n, add({ id: "t:" + t, kind: "tag", label: t, r: 5 })));
        });

        // Posición inicial: proyectos en anillo, el resto alrededor de su proyecto
        const canvas = document.getElementById("map");
        const ctx = canvas.getContext("2d");
        let W = 0, H = 0, dpr = 1;
        const center = () => ({ x: W < 760 ? W / 2 : (W - (panelOpen ? 420 : 0)) / 2, y: W < 760 ? H * 0.42 : H / 2 + 20 });
        let panelOpen = false;
        let alpha = 1;
        let raf = 0;

        function resize() {
          dpr = Math.min(devicePixelRatio || 1, 2);
          W = innerWidth;
          H = innerHeight;
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          wake();
        }
        resize();
        addEventListener("resize", resize);

        const c0 = center();
        const projs = nodes.filter((n) => n.kind === "project");
        const R = Math.min(W, H) * 0.26;
        me.x = c0.x; me.y = c0.y;
        projs.forEach((n, i) => {
          const a = (i / projs.length) * Math.PI * 2 - Math.PI / 2;
          n.x = c0.x + Math.cos(a) * R;
          n.y = c0.y + Math.sin(a) * R;
        });
        nodes.forEach((n) => {
          if (n.kind === "tag" || n.kind === "company") {
            const ps = [...n.links];
            const ax = ps.reduce((s, p) => s + p.x, 0) / ps.length;
            const ay = ps.reduce((s, p) => s + p.y, 0) / ps.length;
            n.x = ax + (ax - c0.x) * 0.5 + (Math.random() - 0.5) * 60;
            n.y = ay + (ay - c0.y) * 0.5 + (Math.random() - 0.5) * 60;
          }
        });

        // ---------- Física ----------
        function wake(a = 0.6) {
          alpha = Math.max(alpha, a);
          if (!raf) raf = requestAnimationFrame(frame);
        }
        function physics() {
          const c = center();
          const scale = Math.min(1, Math.min(W, H) / 800);
          const rest = (a, b) => (a.kind === "me" || b.kind === "me" ? 190 : a.kind === "company" || b.kind === "company" ? 110 : 70) * Math.max(0.55, scale);
          for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            for (let j = i + 1; j < nodes.length; j++) {
              const b = nodes[j];
              let dx = b.x - a.x, dy = b.y - a.y;
              let d2 = dx * dx + dy * dy || 0.01;
              if (d2 > 90000) continue;
              const f = (1400 * scale) / d2;
              const d = Math.sqrt(d2);
              dx /= d; dy /= d;
              a.vx -= dx * f; a.vy -= dy * f;
              b.vx += dx * f; b.vy += dy * f;
            }
          }
          edges.forEach(([a, b]) => {
            const dx = b.x - a.x, dy = b.y - a.y;
            const d = Math.sqrt(dx * dx + dy * dy) || 1;
            const f = (d - rest(a, b)) * 0.012;
            const fx = (dx / d) * f, fy = (dy / d) * f;
            a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
          });
          nodes.forEach((n) => {
            n.vx += (c.x - n.x) * 0.0016;
            n.vy += (c.y - n.y) * 0.0016;
            if (n === drag) return;
            n.vx *= 0.82; n.vy *= 0.82;
            n.x += n.vx * alpha; n.y += n.vy * alpha;
            // Margen derecho: deja espacio a la etiqueta y, en escritorio, al panel abierto
            const side = W >= 760 && panelOpen ? 444 : 0;
            const label = n.kind === "project" || n.kind === "company" ? Math.min(170, W * 0.36) : 20;
            n.x = Math.max(20, Math.min(W - side - label, n.x));
            n.y = Math.max(90, Math.min(H - 70, n.y));
          });
        }

        // ---------- Dibujo ----------
        let hover = null, drag = null, dropTarget = null, yearFilter = "Todos";
        const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
        let col = {};
        const readColors = () => (col = { fg: css("--fg"), bg: css("--bg"), muted: css("--muted"), accent: css("--accent"), edge: css("--edge"), hot: css("--edge-hot"), line: css("--line") });
        readColors();
        matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); wake(0.05); });

        const visibleYear = (n) => {
          if (yearFilter === "Todos" || n.kind === "me") return true;
          if (n.kind === "project") return n.year === yearFilter;
          return [...n.links].some((p) => p.kind === "project" && p.year === yearFilter);
        };

        function draw() {
          ctx.clearRect(0, 0, W, H);
          const focus = drag || hover;
          const near = focus ? new Set([focus, ...focus.links]) : null;
          const dim = (n) => (near && !near.has(n)) || !visibleYear(n);

          edges.forEach(([a, b]) => {
            const hot = focus && (a === focus || b === focus);
            const off = !visibleYear(a) || !visibleYear(b) || (near && !hot);
            ctx.strokeStyle = hot ? col.hot : col.edge;
            ctx.globalAlpha = off ? 0.25 : 1;
            ctx.lineWidth = hot ? 1.4 : 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          });
          ctx.globalAlpha = 1;

          // Herramientas primero, para que las etiquetas de proyectos queden encima
          const order = [...nodes].sort((a, b) => (b.kind === "tag") - (a.kind === "tag"));
          order.forEach((n) => {
            ctx.globalAlpha = dim(n) ? 0.18 : 1;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + (n === dropTarget ? 6 : 0), 0, Math.PI * 2);
            if (n.kind === "tag") {
              ctx.fillStyle = col.bg; ctx.fill();
              ctx.lineWidth = 1.5; ctx.strokeStyle = col.muted; ctx.stroke();
            } else {
              ctx.fillStyle = n.kind === "company" ? col.accent : col.fg;
              ctx.fill();
            }
            if (n === dropTarget) { ctx.lineWidth = 2; ctx.strokeStyle = col.accent; ctx.stroke(); }

            // Etiquetas: siempre en proyectos, empresas y yo; en tags solo si están cerca del foco
            const showLabel = n.kind !== "tag" || (near && near.has(n)) || W > 1100;
            if (!showLabel) return;
            if (n.kind === "me") {
              ctx.fillStyle = col.bg;
              ctx.font = `400 18px "Instrument Serif", Georgia, serif`;
              ctx.textAlign = "center"; ctx.textBaseline = "middle";
              ctx.fillText(n.label, n.x, n.y + 1);
              return;
            }
            ctx.textAlign = "left"; ctx.textBaseline = "middle";
            if (n.kind === "project") {
              ctx.font = `${n.featured ? 400 : 400} ${n.featured ? 22 : 17}px "Instrument Serif", Georgia, serif`;
              ctx.fillStyle = col.fg;
            } else {
              ctx.font = `500 ${n.kind === "company" ? 12 : 11}px "JetBrains Mono", monospace`;
              ctx.fillStyle = n.kind === "company" ? col.accent : col.muted;
            }
            const tx = n.x + n.r + 8;
            ctx.lineWidth = 6; ctx.strokeStyle = col.bg; ctx.lineJoin = "round";
            ctx.strokeText(n.label, tx, n.y);
            ctx.fillText(n.label, tx, n.y);
          });
          ctx.globalAlpha = 1;
        }

        function frame() {
          raf = 0;
          if (!reduce) physics();
          else for (let i = 0; i < 300 && alpha > 0.02; i++) { physics(); alpha *= 0.99; }
          draw();
          alpha *= 0.985;
          if (alpha > 0.02 || drag) raf = requestAnimationFrame(frame);
        }
        if (reduce) { for (let i = 0; i < 400; i++) physics(); }
        wake(1);

        // ---------- Puntero ----------
        const pick = (x, y, skip) => {
          let best = null, bd = Infinity;
          nodes.forEach((n) => {
            if (n === skip || !visibleYear(n)) return;
            const d = Math.hypot(n.x - x, n.y - y);
            if (d < n.r + 10 && d < bd) { best = n; bd = d; }
          });
          return best;
        };
        let down = null;
        canvas.addEventListener("pointerdown", (e) => {
          const n = pick(e.clientX, e.clientY);
          if (!n) return;
          drag = n;
          down = { x: e.clientX, y: e.clientY, moved: false };
          canvas.setPointerCapture(e.pointerId);
          canvas.className = "is-grabbing";
          hideHint();
          wake(0.5);
        });
        canvas.addEventListener("pointermove", (e) => {
          if (drag) {
            if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) down.moved = true;
            drag.x = e.clientX; drag.y = e.clientY; drag.vx = drag.vy = 0;
            dropTarget = drag.kind === "project" ? (() => { const t = pick(e.clientX, e.clientY, drag); return t && t.kind === "project" ? t : null; })() : null;
            wake(0.4);
            return;
          }
          const n = pick(e.clientX, e.clientY);
          if (n !== hover) { hover = n; canvas.className = n ? "is-grab" : ""; wake(0.05); }
        });
        const up = () => {
          if (!drag) return;
          const n = drag, t = dropTarget;
          drag = null; dropTarget = null;
          canvas.className = hover ? "is-grab" : "";
          if (t) showCommon(n, t);
          else if (!down.moved) open(n);
          wake(0.3);
        };
        canvas.addEventListener("pointerup", up);
        canvas.addEventListener("pointercancel", up);
        canvas.addEventListener("pointerleave", () => { if (!drag && hover) { hover = null; wake(0.05); } });

        const hint = document.getElementById("hint");
        const hideHint = () => (hint.style.opacity = 0);

        // ---------- Filtro por año ----------
        const years = ["Todos", ...new Set(projs.map((p) => p.year))];
        const yearsEl = document.getElementById("years");
        yearsEl.innerHTML = years.map((y) => `<button type="button" aria-pressed="${y === "Todos"}">${y}</button>`).join("");
        yearsEl.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          yearFilter = b.textContent;
          yearsEl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
          wake(0.05);
        });

        // ---------- Panel ----------
        const panel = document.getElementById("panel");
        const body = document.getElementById("panel-body");
        const kicker = document.getElementById("panel-kicker");
        function setPanel(k, html) {
          kicker.textContent = k;
          body.innerHTML = html;
          body.scrollTop = 0;
          panel.classList.add("is-open");
          panelOpen = true;
          document.body.classList.add("panel-open");
          wake(0.3);
        }
        document.getElementById("panel-close").addEventListener("click", () => {
          panel.classList.remove("is-open");
          panelOpen = false;
          document.body.classList.remove("panel-open");
          wake(0.3);
        });
        body.addEventListener("click", (e) => {
          const b = e.target.closest("[data-node]");
          if (b) open(byId.get(b.dataset.node));
          const c = e.target.closest("[data-copy]");
          if (c) navigator.clipboard?.writeText(profile.links.email).then(() => (c.textContent = "Copiado ✓"), () => {});
        });

        const chipsFor = (n, kinds) =>
          `<ul class="chips">${[...n.links]
            .filter((x) => kinds.includes(x.kind))
            .map((x) => `<li><button type="button" data-node="${esc(x.id)}">${esc(x.label)}</button></li>`)
            .join("")}</ul>`;

        function aboutHTML() {
          const l = profile.links;
          return `<img src="${IMG("assets/img/ignacio.jpg")}" alt="Retrato de ${esc(profile.name)}" />
            <h2>${esc(profile.name)}</h2>
            <p class="panel__meta">${esc(profile.role)} · ${esc(profile.location)}</p>
            ${profile.about.map((a) => `<p>${esc(a)}</p>`).join("")}
            <ul class="chips">${profile.skills.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
            <p class="panel__meta">Contacto</p>
            <a class="panel__mail" href="mailto:${l.email}">${esc(l.email)}</a>
            <ul class="chips"><li><button type="button" data-copy>Copiar correo</button></li><li><a href="${l.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a></li><li><a href="${l.behance}" target="_blank" rel="noopener">Behance ↗</a></li></ul>`;
        }

        function open(n) {
          if (n.kind === "me") return setPanel("Sobre mí", aboutHTML());
          if (n.kind === "project") {
            const p = n.data;
            return setPanel(`Proyecto · ${p.year}`, `
              <img src="${IMG(p.cover)}" alt="${esc(p.title)}" />
              <h2>${esc(p.title)}</h2>
              <p class="panel__meta">${esc(p.category)} · ${esc(p.year)}</p>
              ${p.summary ? `<p>${esc(p.summary)}</p>` : ""}
              ${p.highlights ? `<ul class="hl">${p.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
              ${(p.details || []).map((d, j) => `<img src="${IMG(d)}" alt="${esc(p.title)}, detalle ${j + 1}" loading="lazy" />`).join("")}
              <p class="panel__meta">Conectado con</p>
              ${chipsFor(n, ["company", "tag"])}
              ${p.url ? `<a class="panel__cta" href="${p.url}" target="_blank" rel="noopener">Ver en Behance ↗</a>` : ""}`);
          }
          // Empresa o herramienta: qué proyectos la tocan
          const ps = [...n.links].filter((x) => x.kind === "project");
          setPanel(n.kind === "company" ? "Empresa" : "Herramienta o área", `
            <h2>${esc(n.label)}</h2>
            <p class="panel__meta">${ps.length} ${ps.length === 1 ? "proyecto" : "proyectos"}</p>
            ${chipsFor(n, ["project"])}`);
        }

        function showCommon(a, b) {
          const shared = [...a.links].filter((x) => x !== me && b.links.has(x));
          setPanel("En común", `
            <div class="common"><b>${esc(a.label)}</b><span>+</span><b>${esc(b.label)}</b></div>
            ${shared.length
              ? `<p>Comparten ${shared.length === 1 ? "un nodo" : shared.length + " nodos"}:</p>
                 <ul class="chips">${shared.map((x) => `<li><button type="button" data-node="${esc(x.id)}">${esc(x.label)}</button></li>`).join("")}</ul>`
              : `<p>No comparten empresa ni herramientas. Lo único que los une es que ambos son trabajo de ${esc(profile.name.split(" ")[0])}.</p>`}
            <p class="panel__meta">Abrir</p>
            <ul class="chips"><li><button type="button" data-node="${esc(a.id)}">${esc(a.label)}</button></li><li><button type="button" data-node="${esc(b.id)}">${esc(b.label)}</button></li></ul>`);
        }

        // ---------- Vista en texto ----------
        const tv = document.getElementById("textview");
        document.getElementById("textview-inner").innerHTML = `
          <div class="top"><h2>${esc(profile.name)}</h2><button class="textview-btn" type="button" id="close-text">Volver al mapa</button></div>
          <p>${esc(profile.role)} · ${esc(profile.location)}</p>
          ${profile.about.map((a) => `<p>${esc(a)}</p>`).join("")}
          ${[...featured, ...projects]
            .map(
              (p) => `<article>
                <p class="panel__meta">${esc(p.category)} · ${esc(p.year)}${company[p.title] ? " · " + company[p.title] : ""}</p>
                <h3>${esc(p.title)}</h3>
                ${p.summary ? `<p>${esc(p.summary)}</p>` : ""}
                ${p.highlights ? `<ul class="hl" style="padding-left:18px">${p.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
                ${p.url ? `<a href="${p.url}" target="_blank" rel="noopener">Ver en Behance ↗</a>` : ""}
              </article>`
            )
            .join("")}
          <article><h3>Contacto</h3><a class="panel__mail" href="mailto:${profile.links.email}">${esc(profile.links.email)}</a></article>`;
        document.getElementById("open-text").addEventListener("click", () => { tv.classList.add("is-open"); document.getElementById("close-text").focus(); });
        tv.addEventListener("click", (e) => { if (e.target.id === "close-text") tv.classList.remove("is-open"); });
        addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          if (tv.classList.contains("is-open")) tv.classList.remove("is-open");
          else document.getElementById("panel-close").click();
        });

        // Se abre con Ignacio, el primer nodo, para que se entienda dónde partir
        if (W >= 760) setTimeout(() => open(me), 700);
        document.fonts && document.fonts.ready.then(() => wake(0.05));
      })();
    </script>
    <script src="../../js/switcher.js" data-root="../../" data-current="mapa"></script>
  </body>
</html>
