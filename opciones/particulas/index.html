<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ignacio Grandón · Partículas</title>
    <meta name="description" content="Portafolio de Ignacio Grandón hecho de partículas que cambian de forma, color y tipografía con el scroll, el mouse y el dedo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Opción 3: partículas. Un campo de partículas forma una figura por sección
         (nombre, grilla de Lyra, grafo, mapa de asientos, planilla...). El scroll
         cambia figura, colores y tipografía; el mouse o el dedo empuja, junta y
         hace explotar las partículas; los títulos cambian de grosor según la
         cercanía del puntero. Los colores los escribe el JS en :root. */
      :root {
        --bg: #0d0d0c;
        --fg: #ecebe7;
        --accent: #ff5a36;
        --serif: "Fraunces", Georgia, serif;
        --sans: "Inter Tight", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        --gutter: clamp(16px, 4vw, 56px);
        color-scheme: dark;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        background: var(--bg); color: var(--fg);
        font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      a { color: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      ::selection { background: var(--fg); color: var(--bg); }

      #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none; }

      /* ---------- Chrome fijo ---------- */
      .hud {
        position: fixed; z-index: 3; left: 0; right: 0; top: 0; pointer-events: none;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: calc(16px + env(safe-area-inset-top)) var(--gutter) 0;
        font: 500 12px/1 var(--mono); letter-spacing: .04em;
      }
      .hud a { pointer-events: auto; text-decoration: none; font: 600 14px/1 var(--sans); letter-spacing: 0; }
      .hud__now { display: flex; gap: 10px; align-items: center; opacity: .8; }
      .hud__now b { color: var(--accent); font-weight: 600; }
      .hint {
        position: fixed; z-index: 3; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%);
        font: 500 12px/1.3 var(--mono); padding: 9px 14px; border-radius: 999px; white-space: nowrap;
        background: color-mix(in srgb, var(--bg) 70%, transparent); border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        transition: opacity .6s; pointer-events: none;
      }
      .hint.is-off { opacity: 0; }

      /* ---------- Secciones ---------- */
      main { position: relative; z-index: 2; }
      .sec { position: relative; min-height: 160vh; padding: 0 var(--gutter); }
      .sec__content {
        position: sticky; top: 14vh; width: min(46vw, 620px); padding: 24px 0 48px;
        display: flex; flex-direction: column; gap: 16px;
      }
      .sec--hero { min-height: 130vh; }
      .sec--hero .sec__content { top: 62vh; position: absolute; left: var(--gutter); right: var(--gutter); width: auto; flex-direction: row; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; }
      .kicker { font: 500 12px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
      .title { font-size: clamp(44px, 6.4vw, 104px); line-height: .95; letter-spacing: -.02em; }
      .title .w { display: inline-block; white-space: nowrap; }
      .title .ch { display: inline-block; font-variation-settings: "wght" var(--w, 400); transition: font-variation-settings .25s ease-out; will-change: font-variation-settings; }
      .f-serif { font-family: var(--serif); }
      .f-serif-i { font-family: var(--serif); font-style: italic; }
      .f-sans { font-family: var(--sans); }
      .f-mono { font-family: var(--mono); font-size: clamp(36px, 5vw, 80px); letter-spacing: -.04em; }
      .lede { font-size: clamp(17px, 1.4vw, 20px); max-width: 52ch; }
      .hl { list-style: none; display: grid; gap: 8px; font-size: 15px; max-width: 56ch; }
      .hl li { display: grid; grid-template-columns: 22px 1fr; }
      .hl li::before { content: "→"; color: var(--accent); font-family: var(--mono); }
      .shot {
        width: 100%; max-width: 520px; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; display: block;
        clip-path: inset(0 0 100% 0 round 12px); transition: clip-path 1.1s cubic-bezier(.16,1,.3,1);
      }
      .shot.is-in { clip-path: inset(0 0 0 0 round 12px); }
      .btn {
        align-self: flex-start; display: inline-flex; gap: 8px; padding: 11px 18px; border-radius: 999px;
        border: 1px solid currentColor; text-decoration: none; font-weight: 500; font-size: 14px;
        transition: background .2s, color .2s;
      }
      .btn:hover { background: var(--fg); color: var(--bg); }
      .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
      .chips li { font: 500 12px/1 var(--mono); padding: 7px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--fg) 30%, transparent); }
      .list { list-style: none; display: grid; }
      .list a { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: baseline; padding: 16px 0; border-top: 1px solid color-mix(in srgb, var(--fg) 25%, transparent); text-decoration: none; }
      .list a b { font: 400 clamp(26px, 3vw, 40px)/1.05 var(--serif); }
      .list a span { font: 500 12px/1.3 var(--mono); opacity: .7; }
      .list a:hover b { font-style: italic; }
      .mail { font: 500 clamp(26px, 3.3vw, 52px)/1.05 var(--sans); letter-spacing: -.02em; text-decoration: none; overflow-wrap: anywhere; }
      .about p { max-width: 58ch; }
      .hero__sub { font-size: clamp(18px, 1.8vw, 26px); max-width: 30ch; }
      .hero__role { font: 500 12px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .foot { position: relative; z-index: 2; padding: 32px var(--gutter) 110px; font: 500 12px/1.4 var(--mono); opacity: .7; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

      /* ---------- Móvil: figura arriba, texto abajo con fondo ---------- */
      @media (max-width: 899px) {
        .sec { min-height: auto; padding-top: 56svh; padding-bottom: 12svh; }
        .sec__content {
          position: relative; top: 0; width: auto; padding: 20px;
          border-radius: 18px; gap: 14px;
          background: color-mix(in srgb, var(--bg) 82%, transparent);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .sec--hero { min-height: 100svh; padding-top: 0; }
        .sec--hero .sec__content { position: absolute; top: auto; bottom: 20svh; left: 16px; right: 16px; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 0; flex-direction: column; align-items: flex-start; }
        .title { font-size: clamp(38px, 11vw, 60px); }
        .f-mono { font-size: clamp(30px, 9vw, 48px); }
        .shot { max-width: none; }
        .hint { bottom: calc(70px + env(safe-area-inset-bottom)); white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 32px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .shot { clip-path: none; transition: none; }
        .title .ch { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="hud">
      <a href="#s0" id="brand"></a>
      <span class="hud__now" aria-hidden="true"><b id="now-n">01</b><span id="now-label"></span></span>
    </div>
    <p class="hint" id="hint" aria-hidden="true"></p>

    <main id="main"></main>
    <footer class="foot"><span id="foot-name"></span><span>Hecho a mano con HTML, CSS y canvas</span></footer>

    <script src="../../js/data.js"></script>
    <script>
      (function () {
        const { profile, featured, projects } = window.PORTFOLIO;
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const touchFirst = matchMedia("(hover: none)").matches;
        const IMG = (s) => "../../" + s;
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        const pad = (n) => String(n).padStart(2, "0");

        document.getElementById("brand").textContent = profile.name;
        document.getElementById("foot-name").textContent = `© ${new Date().getFullYear()} ${profile.name}`;
        document.getElementById("hint").textContent = touchFirst
          ? "Desliza · Deja el dedo quieto para juntar · Toca para soltar"
          : "Mueve el mouse · Mantén presionado para juntar · Clic para soltar";

        // Títulos cinéticos: cada letra es un span con su propio grosor (--w)
        const kinetic = (text, cls, tag = "h2") =>
          `<${tag} class="title ${cls}" aria-label="${esc(text)}">${text
            .split(" ")
            .map((w) => `<span class="w" aria-hidden="true">${[...w].map((c) => `<span class="ch">${esc(c)}</span>`).join("")}</span>`)
            .join(" ")}</${tag}>`;

        // ---------- Secciones: contenido, figura, paleta y tipografía ----------
        // Paletas por sección: [fondo, partículas/texto, acento]
        const sections = [
          {
            shape: "name", label: "Inicio", pal: ["#0d0d0c", "#ecebe7", "#ff5a36"], hero: true,
            html: `<div><p class="hero__role">${esc(profile.role)} · ${esc(profile.location)}</p>
                     ${kinetic(profile.name, "f-serif", "h1")}</div>
                   <p class="hero__sub">${esc(profile.headline)}</p>`,
          },
          ...featured.map((p, i) => ({
            shape: ["grid", "network", "seats", "sheet"][i],
            label: p.title,
            pal: [["#1a0b2e", "#f1e9ff", "#c084fc"], ["#06121f", "#d6ecff", "#4fd1c5"], ["#f3efe6", "#1b1b1b", "#ff4f6d"], ["#0f1f17", "#e6f4ea", "#34d27b"]][i],
            html: `<p class="kicker">${pad(i + 1)} · ${esc(p.category)} · ${esc(p.year)}</p>
                   ${kinetic(p.title, ["f-sans", "f-mono", "f-serif-i", "f-sans"][i])}
                   <p class="lede">${esc(p.summary)}</p>
                   <ul class="hl">${p.highlights.slice(0, 3).map((h) => `<li>${esc(h)}</li>`).join("")}</ul>
                   <img class="shot" src="${IMG(p.cover)}" alt="${esc(p.title)}" loading="lazy" />
                   ${p.url ? `<a class="btn" href="${p.url}" target="_blank" rel="noopener">Ver en Behance ↗</a>` : ""}`,
          })),
          {
            shape: "orbits", label: "Más proyectos", pal: ["#f4f2ee", "#141414", "#2f5bff"],
            html: `<p class="kicker">${pad(projects.length)} proyectos · 2017</p>
                   ${kinetic("Más proyectos", "f-mono")}
                   <ul class="list">${projects
                     .map((p) => `<li><a href="${p.url}" target="_blank" rel="noopener"><b>${esc(p.title)}</b><span>${esc(p.category)} · ${esc(p.year)} ↗</span></a></li>`)
                     .join("")}</ul>`,
          },
          {
            shape: "sphere", label: "Sobre mí", pal: ["#e9e3d6", "#1c1a17", "#b4532a"],
            html: `<p class="kicker">Sobre mí</p>
                   ${kinetic("Hola, soy Ignacio", "f-serif")}
                   <div class="about">${profile.about.map((a) => `<p>${esc(a)}</p>`).join("")}</div>
                   <ul class="chips">${profile.skills.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>`,
          },
          {
            shape: "at", label: "Contacto", pal: ["#0d0d0c", "#ecebe7", "#f4c430"],
            html: `<p class="kicker">¿Trabajamos juntos?</p>
                   ${kinetic("Escríbeme", "f-sans")}
                   <a class="mail" href="mailto:${profile.links.email}">${esc(profile.links.email)}</a>
                   <ul class="chips">
                     <li><a href="${profile.links.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a></li>
                     <li><a href="${profile.links.behance}" target="_blank" rel="noopener">Behance ↗</a></li>
                   </ul>`,
          },
        ];
        const main = document.getElementById("main");
        main.innerHTML = sections
          .map((s, i) => `<section class="sec${s.hero ? " sec--hero" : ""}" id="s${i}"><div class="sec__content">${s.html}</div></section>`)
          .join("");

        // Imágenes que se revelan al entrar
        const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && e.target.classList.add("is-in")), { threshold: 0.25 });
        document.querySelectorAll(".shot").forEach((el) => io.observe(el));

        // ---------- Canvas ----------
        const cv = document.getElementById("fx");
        const ctx = cv.getContext("2d");
        let W = 0, H = 0, DPR = 1, N = 0, mobile = false;
        let px, py, vx, vy, seed; // estado de cada partícula
        const targets = []; // por sección: Float32Array(2N)

        // Aleatorio con semilla, para que las figuras sean estables entre recargas
        const rng = (a) => () => {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

        const shapeBox = (hero) =>
          mobile
            ? hero ? { x: 16, y: H * 0.14, w: W - 32, h: H * 0.34 } : { x: 20, y: H * 0.1, w: W - 40, h: H * 0.38 }
            : hero ? { x: W * 0.05, y: H * 0.12, w: W * 0.9, h: H * 0.44 } : { x: W * 0.52, y: H * 0.14, w: W * 0.42, h: H * 0.72 };

        // Puntos tomados de un texto dibujado fuera de pantalla
        function textPoints(str, box, font, out) {
          const c = document.createElement("canvas");
          const s = 0.5; // muestreo a media resolución
          c.width = Math.max(1, Math.floor(box.w * s));
          c.height = Math.max(1, Math.floor(box.h * s));
          const g = c.getContext("2d");
          let size = c.height;
          g.font = font(size);
          const m = g.measureText(str).width;
          if (m > c.width * 0.9) size *= (c.width * 0.9) / m;
          g.font = font(size);
          g.textAlign = "center"; g.textBaseline = "middle";
          g.fillStyle = "#000";
          g.fillText(str, c.width / 2, c.height / 2 + size * 0.06);
          const d = g.getImageData(0, 0, c.width, c.height).data;
          const cand = [];
          for (let y = 0; y < c.height; y += 1) for (let x = 0; x < c.width; x += 1) if (d[(y * c.width + x) * 4 + 3] > 140) cand.push(x, y);
          const r = rng(7);
          const n = cand.length / 2;
          for (let i = 0; i < N; i++) {
            const k = n ? Math.floor(r() * n) : 0;
            out[2 * i] = box.x + ((cand[2 * k] || 0) + r()) / s;
            out[2 * i + 1] = box.y + ((cand[2 * k + 1] || 0) + r()) / s;
          }
        }

        // Grilla de 208 celdas: los 208 componentes de Lyra
        function gridPoints(box, out) {
          const cols = 16, rows = 13;
          const cell = Math.min(box.w / cols, box.h / rows);
          const ox = box.x + (box.w - cell * cols) / 2, oy = box.y + (box.h - cell * rows) / 2;
          const r = rng(11);
          const inner = cell * 0.72;
          for (let i = 0; i < N; i++) {
            const c = i % 208;
            const cx = ox + (c % cols) * cell + (cell - inner) / 2;
            const cy = oy + Math.floor(c / cols) * cell + (cell - inner) / 2;
            // Una de cada cinco celdas va rellena (las "variantes"); el resto, solo el borde
            if (c % 5 === 0) {
              out[2 * i] = cx + r() * inner; out[2 * i + 1] = cy + r() * inner;
            } else {
              const t = r() * 4, side = Math.floor(t), f = (t - side) * inner;
              out[2 * i] = cx + (side === 0 ? f : side === 1 ? inner : side === 2 ? inner - f : 0);
              out[2 * i + 1] = cy + (side === 0 ? 0 : side === 1 ? f : side === 2 ? inner : inner - f);
            }
          }
        }

        // Grafo: nodos y aristas, como el mapa agéntico
        function networkPoints(box, out) {
          const r = rng(23);
          const nodes = [];
          for (let k = 0; k < 22; k++) nodes.push({ x: box.x + box.w * (0.08 + r() * 0.84), y: box.y + box.h * (0.08 + r() * 0.84), s: k < 4 ? 16 : 5 + r() * 7 });
          const edges = [];
          nodes.forEach((a, i) => {
            nodes.map((b, j) => [j, Math.hypot(a.x - b.x, a.y - b.y)]).filter(([j]) => j !== i).sort((p, q) => p[1] - q[1]).slice(0, 2).forEach(([j]) => edges.push([a, nodes[j]]));
          });
          for (let i = 0; i < N; i++) {
            if (i % 5 < 2) {
              const n = nodes[i % nodes.length], a = r() * Math.PI * 2, rr = n.s * Math.sqrt(r());
              out[2 * i] = n.x + Math.cos(a) * rr; out[2 * i + 1] = n.y + Math.sin(a) * rr;
            } else {
              const [a, b] = edges[i % edges.length], t = r();
              out[2 * i] = a.x + (b.x - a.x) * t; out[2 * i + 1] = a.y + (b.y - a.y) * t;
            }
          }
        }

        // Teléfono con un mapa de asientos (6 columnas con pasillo)
        function seatPoints(box, out) {
          const r = rng(31);
          const ph = box.h, pw = Math.min(box.w, ph * 0.49);
          const x0 = box.x + (box.w - pw) / 2, y0 = box.y;
          const rad = pw * 0.14;
          const per = 2 * (pw + ph);
          const cols = 6, rows = 11;
          const gx = x0 + pw * 0.12, gw = pw * 0.76, gy = y0 + ph * 0.16, gh = ph * 0.72;
          const sw = gw / (cols + 1), sh = gh / rows;
          for (let i = 0; i < N; i++) {
            if (i % 4 === 0) {
              // contorno del teléfono (esquinas recortadas hacia adentro)
              let t = r() * per, x, y;
              if (t < pw) { x = x0 + t; y = y0; } else if (t < pw + ph) { x = x0 + pw; y = y0 + t - pw; } else if (t < 2 * pw + ph) { x = x0 + pw - (t - pw - ph); y = y0 + ph; } else { x = x0; y = y0 + ph - (t - 2 * pw - ph); }
              const cx = Math.min(Math.max(x, x0 + rad), x0 + pw - rad), cy = Math.min(Math.max(y, y0 + rad), y0 + ph - rad);
              const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
              if (d > rad) { x = cx + (dx / d) * rad; y = cy + (dy / d) * rad; }
              out[2 * i] = x; out[2 * i + 1] = y;
            } else {
              const k = i % (cols * rows), c = k % cols, row = Math.floor(k / cols);
              const col = c < 3 ? c : c + 1; // pasillo al medio
              out[2 * i] = gx + col * sw + sw * (0.15 + r() * 0.7);
              out[2 * i + 1] = gy + row * sh + sh * (0.15 + r() * 0.62);
            }
          }
        }

        // Planilla: líneas de celdas y un gráfico de barras dentro
        function sheetPoints(box, out) {
          const r = rng(41);
          const cols = 7, rows = 12;
          const bars = [3, 5, 4, 7, 6, 9, 11];
          for (let i = 0; i < N; i++) {
            const m = i % 10;
            if (m < 3) { // líneas horizontales
              const row = i % (rows + 1);
              out[2 * i] = box.x + r() * box.w; out[2 * i + 1] = box.y + (row / rows) * box.h;
            } else if (m < 5) { // verticales
              const c = i % (cols + 1);
              out[2 * i] = box.x + (c / cols) * box.w; out[2 * i + 1] = box.y + r() * box.h;
            } else { // barras rellenas
              const c = i % cols, hgt = bars[c] / rows;
              out[2 * i] = box.x + (c + 0.18 + r() * 0.64) * (box.w / cols);
              out[2 * i + 1] = box.y + box.h - r() * hgt * box.h;
            }
          }
        }

        // Tres órbitas, una por proyecto
        function orbitPoints(box, out) {
          const r = rng(53);
          const R = Math.min(box.w, box.h);
          const cs = [
            { x: box.x + box.w * 0.3, y: box.y + box.h * 0.35, r: R * 0.22 },
            { x: box.x + box.w * 0.68, y: box.y + box.h * 0.42, r: R * 0.17 },
            { x: box.x + box.w * 0.45, y: box.y + box.h * 0.75, r: R * 0.13 },
          ];
          for (let i = 0; i < N; i++) {
            const c = cs[i % 3], a = r() * Math.PI * 2, rr = c.r * (i % 2 ? 1 : 0.55 + r() * 0.06);
            out[2 * i] = c.x + Math.cos(a) * rr; out[2 * i + 1] = c.y + Math.sin(a) * rr;
          }
        }

        // Esfera que gira (se recalcula en cada cuadro)
        const fib = [];
        function spherePoints(box, out, time, spin) {
          if (fib.length !== N) {
            fib.length = 0;
            for (let i = 0; i < N; i++) {
              const y = 1 - (i / (N - 1)) * 2, rad = Math.sqrt(1 - y * y), th = i * 2.399963;
              fib.push([Math.cos(th) * rad, y, Math.sin(th) * rad]);
            }
          }
          const R = Math.min(box.w, box.h) * 0.42, cx = box.x + box.w / 2, cy = box.y + box.h / 2;
          const a = time * 0.00025 + spin, ca = Math.cos(a), sa = Math.sin(a), tilt = 0.35, ct = Math.cos(tilt), st = Math.sin(tilt);
          for (let i = 0; i < N; i++) {
            const [x, y, z] = fib[i];
            const x1 = x * ca + z * sa, z1 = -x * sa + z * ca;
            const y2 = y * ct - z1 * st, z2 = y * st + z1 * ct;
            const p = 1 / (1.8 - z2 * 0.6);
            out[2 * i] = cx + x1 * R * p * 1.2; out[2 * i + 1] = cy + y2 * R * p * 1.2;
          }
        }

        function build() {
          W = innerWidth; H = innerHeight;
          mobile = W < 900;
          DPR = Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2);
          cv.width = W * DPR; cv.height = H * DPR;
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          const want = Math.round(Math.min(3400, Math.max(1100, (W * H) / (mobile ? 260 : 360))));
          if (want !== N) {
            const old = N;
            const nx = new Float32Array(want), ny = new Float32Array(want), nvx = new Float32Array(want), nvy = new Float32Array(want), ns = new Float32Array(want);
            for (let i = 0; i < want; i++) {
              nx[i] = i < old ? px[i] : Math.random() * W; ny[i] = i < old ? py[i] : Math.random() * H;
              nvx[i] = i < old ? vx[i] : 0; nvy[i] = i < old ? vy[i] : 0;
              ns[i] = (i * 0.6180339887) % 1; // retraso escalonado para el cambio de forma
            }
            px = nx; py = ny; vx = nvx; vy = nvy; seed = ns; N = want;
          }
          const serif = (s) => `800 ${s}px Fraunces, Georgia, serif`;
          const sans = (s) => `700 ${s}px "Inter Tight", system-ui, sans-serif`;
          sections.forEach((s, k) => {
            const out = targets[k] && targets[k].length === 2 * N ? targets[k] : (targets[k] = new Float32Array(2 * N));
            const box = shapeBox(s.hero);
            if (s.shape === "name") textPoints(mobile ? "IGNACIO" : "Ignacio", box, serif, out);
            else if (s.shape === "grid") gridPoints(box, out);
            else if (s.shape === "network") networkPoints(box, out);
            else if (s.shape === "seats") seatPoints(box, out);
            else if (s.shape === "sheet") sheetPoints(box, out);
            else if (s.shape === "orbits") orbitPoints(box, out);
            else if (s.shape === "sphere") spherePoints(box, out, 0, 0);
            else if (s.shape === "at") textPoints("@", box, sans, out);
          });
          measure();
        }

        // Centros de cada sección, para saber entre cuáles está el scroll
        let centers = [];
        function measure() {
          centers = [...main.children].map((el) => el.offsetTop + Math.min(el.offsetHeight, H * 1.6) / 2);
          centers[0] = 0;
        }

        // ---------- Puntero (mouse y dedo) ----------
        const ptr = { x: -9999, y: -9999, on: false, down: false, t0: 0, x0: 0, y0: 0, moved: 0 };
        const hint = document.getElementById("hint");
        let hinted = false;
        const firstTouch = () => { if (!hinted) { hinted = true; setTimeout(() => hint.classList.add("is-off"), 2500); } };
        // La ayuda se va al interactuar o al bajar de la primera pantalla
        addEventListener("scroll", () => { if (scrollY > innerHeight * 0.4) hint.classList.add("is-off"); }, { passive: true });
        let bursts = [];
        const press = (x, y) => { Object.assign(ptr, { x, y, on: true, down: true, t0: performance.now(), x0: x, y0: y, moved: 0 }); firstTouch(); };
        const move = (x, y) => { ptr.moved = Math.max(ptr.moved, Math.hypot(x - ptr.x0, y - ptr.y0)); ptr.x = x; ptr.y = y; ptr.on = true; kick = true; };
        const release = () => {
          if (ptr.down && performance.now() - ptr.t0 < 260 && ptr.moved < 12) bursts.push({ x: ptr.x, y: ptr.y });
          ptr.down = false;
        };
        addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") move(e.clientX, e.clientY); }, { passive: true });
        addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") press(e.clientX, e.clientY); });
        addEventListener("pointerup", (e) => { if (e.pointerType === "mouse") release(); });
        document.addEventListener("pointerleave", () => (ptr.on = false));
        // Con el dedo se usan eventos touch: siguen llegando mientras la página hace scroll
        addEventListener("touchstart", (e) => { const t = e.touches[0]; press(t.clientX, t.clientY); }, { passive: true });
        addEventListener("touchmove", (e) => { const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
        addEventListener("touchend", () => { release(); setTimeout(() => { if (!ptr.down) ptr.on = false; }, 400); }, { passive: true });

        // ---------- Colores ----------
        const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
        const pals = sections.map((s) => s.pal.map(hex));
        const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
        const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
        const toHex = (c) => "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
        let lastVars = "";

        // ---------- Títulos cinéticos ----------
        let letters = [];
        const collectLetters = () => (letters = [...document.querySelectorAll(".title .ch")].map((el) => ({ el, sec: +el.closest(".sec").id.slice(1), w: 400 })));
        collectLetters();
        let kick = true;
        function updateLetters(sec, vel) {
          const near = letters.filter((l) => Math.abs(l.sec - sec) <= 1);
          const R = mobile ? 140 : 220;
          near.forEach((l) => {
            let w = 380;
            if (ptr.on) {
              const b = l.el.getBoundingClientRect();
              if (b.bottom > -50 && b.top < H + 50) {
                const d = Math.hypot(b.left + b.width / 2 - ptr.x, b.top + b.height / 2 - ptr.y);
                w = 380 + Math.max(0, 1 - d / R) * 520;
              }
            }
            w = Math.round(w / 20) * 20;
            if (w !== l.w) { l.w = w; l.el.style.setProperty("--w", w); }
          });
          // Inclinación según la velocidad del scroll
          const sk = Math.max(-10, Math.min(10, vel * 0.35));
          document.querySelectorAll(".title").forEach((t) => (t.style.transform = reduce ? "" : `skewX(${-sk.toFixed(2)}deg)`));
        }

        // ---------- Bucle ----------
        const nowN = document.getElementById("now-n"), nowL = document.getElementById("now-label");
        let lastSec = -1, lastY = scrollY, vel = 0, spin = 0, sphereOut = null;

        function frame(time) {
          requestAnimationFrame(frame);
          // Posición del scroll entre dos secciones
          const s = scrollY + H / 2;
          let i = 0;
          while (i < centers.length - 1 && s >= centers[i + 1]) i++;
          const j = Math.min(i + 1, sections.length - 1);
          const raw = j === i ? 0 : Math.max(0, Math.min(1, (s - centers[i]) / (centers[j] - centers[i])));
          const tm = reduce ? (raw > 0.5 ? 1 : 0) : Math.max(0, Math.min(1, (raw - 0.25) / 0.5));
          const sec = tm > 0.5 ? j : i;
          if (sec !== lastSec) { lastSec = sec; nowN.textContent = pad(sec + 1); nowL.textContent = sections[sec].label; }

          const dy = scrollY - lastY; lastY = scrollY;
          vel += (dy - vel) * 0.2;

          // La esfera gira; el puntero la acelera
          if (sections[i].shape === "sphere" || sections[j].shape === "sphere") {
            const k = sections.findIndex((x) => x.shape === "sphere");
            spin += ptr.on ? (ptr.x / W - 0.5) * 0.03 : 0;
            spherePoints(shapeBox(false), targets[k], reduce ? 0 : time, spin);
          }

          // Paleta interpolada
          const ease = tm * tm * (3 - 2 * tm);
          const [bg, fg, ac] = [0, 1, 2].map((k) => mix(pals[i][k], pals[j][k], ease));
          const vars = toHex(bg) + toHex(fg) + toHex(ac);
          if (vars !== lastVars) {
            lastVars = vars;
            const r = document.documentElement.style;
            r.setProperty("--bg", toHex(bg)); r.setProperty("--fg", toHex(fg)); r.setProperty("--accent", toHex(ac));
            const lum = bg[0] * 0.3 + bg[1] * 0.59 + bg[2] * 0.11;
            document.documentElement.style.colorScheme = lum > 140 ? "light" : "dark";
          }

          // Física
          const A = targets[i], B = targets[j];
          const R = mobile ? 90 : 130, R2 = R * R;
          const holding = ptr.down && performance.now() - ptr.t0 > 220 && (touchFirst ? ptr.moved < 14 : true);
          const turb = reduce ? 0 : Math.min(6, Math.abs(vel) * 0.18);
          const k = reduce ? 0.3 : 0.055;
          const bs = bursts; bursts = [];
          for (let p = 0; p < N; p++) {
            let t = (tm - seed[p] * 0.35) / 0.65;
            t = t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
            const tx = A[2 * p] + (B[2 * p] - A[2 * p]) * t;
            const ty = A[2 * p + 1] + (B[2 * p + 1] - A[2 * p + 1]) * t;
            let ax = (tx - px[p]) * k, ay = (ty - py[p]) * k;
            if (ptr.on) {
              const dx = px[p] - ptr.x, dy2 = py[p] - ptr.y, d2 = dx * dx + dy2 * dy2;
              if (holding) {
                // Juntar: las cercanas orbitan alrededor del puntero
                if (d2 < 90000) { const d = Math.sqrt(d2) || 1, f = (1 - d / 300) * 2.4; ax += (-dx / d) * f - (dy2 / d) * f * 0.9; ay += (-dy2 / d) * f + (dx / d) * f * 0.9; }
              } else if (d2 < R2) {
                const d = Math.sqrt(d2) || 1, f = (1 - d / R) * 6;
                ax += (dx / d) * f; ay += (dy2 / d) * f;
              }
            }
            for (let b = 0; b < bs.length; b++) {
              const dx = px[p] - bs[b].x, dy2 = py[p] - bs[b].y, d = Math.hypot(dx, dy2) || 1;
              if (d < 260) { const f = (1 - d / 260) * (reduce ? 8 : 34); vx[p] += (dx / d) * f; vy[p] += (dy2 / d) * f; }
            }
            if (turb) { ax += (Math.sin(p * 12.9898 + time * 0.004) * turb); ay += (Math.cos(p * 78.233 + time * 0.003) * turb) - vel * 0.02; }
            vx[p] = (vx[p] + ax) * 0.84; vy[p] = (vy[p] + ay) * 0.84;
            px[p] += vx[p]; py[p] += vy[p];
          }

          // Dibujo: estela con el color de fondo y partículas en dos colores
          ctx.fillStyle = rgb(bg, reduce ? 1 : 0.32);
          ctx.fillRect(0, 0, W, H);
          const size = mobile ? 1.7 : 1.9;
          for (let g = 0; g < 2; g++) {
            // g = 1: una de cada siete partículas va en el color de acento
            const col = g ? rgb(ac) : rgb(fg, 0.92);
            const dots = new Path2D(), trails = new Path2D();
            for (let p = 0; p < N; p++) {
              if ((p % 7 === 0) !== (g === 1)) continue;
              const sp = Math.abs(vx[p]) + Math.abs(vy[p]);
              if (sp > 2.5) { trails.moveTo(px[p], py[p]); trails.lineTo(px[p] - vx[p] * 2.2, py[p] - vy[p] * 2.2); }
              else dots.rect(px[p] - size / 2, py[p] - size / 2, size, size);
            }
            ctx.fillStyle = col; ctx.fill(dots);
            ctx.strokeStyle = col; ctx.lineWidth = size; ctx.stroke(trails);
          }

          if (kick || Math.abs(vel) > 0.2) { updateLetters(sec, vel); kick = false; }
        }

        build();
        document.fonts && document.fonts.ready.then(build);
        let rt;
        addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 150); });
        addEventListener("load", measure);
        requestAnimationFrame(frame);
      })();
    </script>
    <script src="../../js/switcher.js" data-root="../../" data-current="particulas"></script>
  </body>
